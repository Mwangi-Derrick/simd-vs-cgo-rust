name: Multi-Arch SIMD Benchmarks

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            rust_target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            arch: arm64
            rust_target: aarch64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}
    env:
      GOEXPERIMENT: simd

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"

      - name: Log CPU capabilities
        run: |
          uname -m
          lscpu || cat /proc/cpuinfo | head -n 40

      - name: Build Rust SIMD staticlib
        working-directory: rust-simd
        run: |
          cargo build --release --target ${{ matrix.rust_target }}
          mkdir -p target/release
          cp target/${{ matrix.rust_target }}/release/libfma_rust_simd.a target/release/libfma_rust_simd.a

      - name: Verify Rust SIMD assembly
        working-directory: rust-simd
        run: |
          cargo rustc --release --target ${{ matrix.rust_target }} -- --emit=asm
          find target/${{ matrix.rust_target }}/release -name '*.s' -print -exec cat {} \; > rust-asm-${{ matrix.arch }}.txt
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            grep -Eiq 'vfmadd[0-9]*ps' rust-asm-${{ matrix.arch }}.txt
          else
            grep -Eiq '\bfmla\b' rust-asm-${{ matrix.arch }}.txt
          fi

      - name: Run tests and benchmarks
        run: |
          cd kernel
          go test -v ./...
          go test -bench=BenchmarkFma -benchmem -count=10 | tee bench-${{ matrix.arch }}.txt

      - name: Verify Go SIMD assembly
        run: |
          cd kernel
          go test -c -o kernel.test
          go tool objdump -s 'simdprobe\.Fma(GoSIMD|ArchSIMD)' kernel.test > go-asm-${{ matrix.arch }}.txt
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            grep -Eiq 'VFMADD' go-asm-${{ matrix.arch }}.txt
          else
            grep -Eiq 'FMLA|FMADDS' go-asm-${{ matrix.arch }}.txt
          fi
      
      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Run grouped benchmarks for statistical comparison
        run: |
          cd kernel
          go test -bench='BenchmarkFma/GoSIMD/' -benchmem -count=10 > go_simd-${{ matrix.arch }}.txt
          go test -bench='BenchmarkFma/GoArchSIMD/' -benchmem -count=10 > go_archsimd-${{ matrix.arch }}.txt
          go test -bench='BenchmarkFma/RustCgo/' -benchmem -count=10 > rust_cgo-${{ matrix.arch }}.txt

      - name: Compare Go SIMD vs Rust cgo with benchstat
        run: |
          echo "=== GoArchSIMD (baseline) vs RustCgo ==="
          {
            echo '## ${{ matrix.arch }} benchmark comparison'
            echo '### GoArchSIMD (baseline) vs RustCgo'
            benchstat kernel/go_archsimd-${{ matrix.arch }}.txt kernel/rust_cgo-${{ matrix.arch }}.txt
            echo '### Portable GoSIMD (baseline) vs GoArchSIMD'
            benchstat kernel/go_simd-${{ matrix.arch }}.txt kernel/go_archsimd-${{ matrix.arch }}.txt
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: simd-bench-${{ matrix.arch }}
          path: |
            kernel/bench-${{ matrix.arch }}.txt
            kernel/go_simd-${{ matrix.arch }}.txt
            kernel/go_archsimd-${{ matrix.arch }}.txt
            kernel/rust_cgo-${{ matrix.arch }}.txt
            kernel/go-asm-${{ matrix.arch }}.txt
            rust-simd/rust-asm-${{ matrix.arch }}.txt